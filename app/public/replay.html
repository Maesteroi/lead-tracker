<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1f4d">
<title>شاهد الزيارة · Maestro LT</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/dash.css">
<link rel="stylesheet" href="/vendor/rrweb/rrweb-player.min.css">
<link rel="stylesheet" href="/css/replay.css">
</head>
<body class="dash replay-page">
<header class="rp-top">
  <a class="btn ghost sm" id="back" href="/#/visits" data-i18n="rp.back">‹ العودة إلى الزيارات</a>
  <div class="rp-title"><h1 id="rp-h" data-i18n="rp.title">شاهد الزيارة</h1><span class="dim" id="rp-sub"></span></div>
  <span data-lang-switch></span>
  <div class="seg rp-level" id="level" role="group" aria-label="طريقة العرض" data-i18n-aria="frame.level"></div>
</header>
<main class="rp-main" id="rp-main">
  <section class="rp-stage panel-card">
    <p class="simple-only simple-line" id="rp-story"></p>
    <div id="player" class="rp-player" aria-label="تسجيل الزيارة" data-i18n-aria="rp.player"><div class="loading"><span class="spinner"></span><span data-i18n="rp.loading">جارٍ تحميل التسجيل…</span></div></div>
    <p class="hint rp-note" data-i18n="rp.note">نعيد عرض صفحة موقعك الحقيقية والزائر يتحرك فيها. كل ما كتبه الزائر في الخانات مخفي، ويُحذف التسجيل بعد 30 يومًا.</p>
  </section>
  <aside class="rp-side">
    <section class="panel-card" id="rp-verdict"></section>
    <section class="panel-card" id="rp-contact" hidden></section>
    <section class="panel-card pro-only"><div class="sec-head"><h2 data-i18n="rp.marks.title">اللحظات المهمة</h2></div><p class="hint" data-i18n="rp.marks.hint">انقر أي لحظة لينتقل التسجيل إليها.</p><ol class="rp-marks" id="rp-marks"></ol></section>
    <section class="panel-card pro-only"><div class="sec-head"><h2 data-i18n="rp.details">التفاصيل</h2></div><dl class="facts" id="rp-facts"></dl></section>
  </aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/js/common.js"></script>
<script src="/js/lang/ar.js"></script>
<script src="/js/lang/en.js"></script>
<script src="/js/i18n.js"></script>
<script src="/vendor/rrweb/rrweb-player.min.js"></script>
<script src="/js/replay.js"></script>
</body>
</html>
