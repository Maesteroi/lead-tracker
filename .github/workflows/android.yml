# بناء تطبيق الأندرويد (ط١.٤) واختباراته على GitHub، والملف (APK) بيتحمّل من صفحة التشغيل.
name: android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests + debug APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^(e: |error:|> )|FAILED|Expected|java\.lang\.AssertionError' build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maestro-lt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
