# Maestro LT — لوحة العميل (app.maestrolt.com): صفحات ثابتة على Cloudflare Workers (Static Assets). مفيش سكريبت Worker.
# الدومين بيتربط من هنا (custom_domain)، زي api.maestrolt.com. التفاصيل وخطوات الربط: app/README.md
name = "maestro-app"
compatibility_date = "2026-11-01"
workers_dev = true

routes = [
  { pattern = "app.maestrolt.com", custom_domain = true }
]

[assets]
directory = "./public"
# /login بيفتح login.html و /connect بيفتح connect.html. أي مسار مش موجود = 404 (مش SPA)
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
